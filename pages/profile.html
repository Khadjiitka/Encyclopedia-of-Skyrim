<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Character Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English+SC&display=swap"
        rel="stylesheet">

        
    <link rel="stylesheet" href="../style/profile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="page-transition-overlay"></div>

    <div class="container">
        <!-- ЛЕВАЯ КАРТОЧКА -->
        <div class="card" id="profileCard" style="display: none;">
            <!-- Исправлен путь: ../ вместо ../../ (если папка pic в корне)[cite: 4] -->
            <img id="avatarImg" src="../pic/ava.PNG" class="avatar">
            <h1 id="charName">Loading...</h1>

            <div class="section">
                <div class="section-title">Basic Info</div>
                <p><b>Email:</b> <span id="infoEmail"></span></p>
                <p><b>Race:</b> <span id="infoRace"></span></p>
                <p><b>Gender:</b> <span id="infoGender"></span></p>
                <p><b>City:</b> <span id="infoCity"></span></p>
                <p><b>Standing Stone:</b> <span id="infoStone"></span></p>
            </div>

            <div class="section">
                <div class="section-title">Weapon</div>
                <p><b>Class:</b> <span id="infoWepClass"></span></p>
                <p><b>Type:</b> <span id="infoWepType"></span></p>
                <p><b>Material:</b> <span id="infoWepMat"></span></p>
            </div>

            <div class="section" id="guildsSection" style="display: none;">
                <div class="section-title">Guilds</div>
                <div id="guildsList"></div>
            </div>

            <div class="section">
                <div class="section-title">Backstory</div>
                <div class="backstory" id="infoBackstory"></div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="js-panel">
            <div class="js-content">
                <h1>Adventurer's Board</h1>

                <div id="mainBoard">
                    <div id="welcome">
                        <h2>Loading scrolls...</h2>
                    </div>
                    <p>Choose your activity:</p>
                    <button class="btn-generator-nav" onclick="viewAllHeroes()">View other heroes</button>
                    <button class="btn-generator-nav" onclick="generateShout()">Generate Dragon Shout</button>
                    <button class="btn-generator-nav" onclick="showTamrielDate()">Tamriel Calendar</button>
                </div>

                <div id="heroesListContainer" style="display: none;">
                    <h2>Heroes of Skyrim</h2>
                    <div id="heroesList"
                        style="text-align: left; margin-bottom: 20px; max-height: 300px; overflow-y: auto;"></div>
                    <button class="btn-generator-nav" onclick="showMainMenu()">Back to Menu</button>
                </div>

                <div id="output" class="output"></div>
            </div>

            <div class="bottom-buttons">
                <button class="btn-generator-nav" id="btnMyProfile" style="display:none;" onclick="loadMyProfile()">My
                    Profile</button>
                <a href="../../index.html" class="btn-generator-nav"> Main Page </a>
                <button class="btn-generator-nav" id="btnDelete" onclick="deleteCharacter()">Delete Character</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAabqJzaUr_2ao8GnNfXX2RXykRKTtnkBQ",
            authDomain: "encyclopedia-of-skyrim.firebaseapp.com",
            projectId: "encyclopedia-of-skyrim",
            storageBucket: "encyclopedia-of-skyrim.firebasestorage.app",
            messagingSenderId: "547591246417",
            appId: "1:547591246417:web:0c99692d2f5f5ddd73de70",
            measurementId: "G-QFPWBVMBRV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;

        // --- ЛОГИКА ---

        function renderCharacterData(data, email = "Classified") {
            document.getElementById('charName').innerText = data.name || 'Unknown Hero';
            // Важно: .png должен совпадать с реальным расширением файла![cite: 4]
            document.getElementById('avatarImg').src = data.avatar || "../pic/ava.PNG";
            document.getElementById('infoEmail').innerText = email;
            document.getElementById('infoRace').innerText = data.race;
            document.getElementById('infoGender').innerText = data.gender;
            document.getElementById('infoCity').innerText = data.city;
            document.getElementById('infoStone').innerText = data.stone;
            document.getElementById('infoWepClass').innerText = data.weapon_class;
            document.getElementById('infoWepType').innerText = data.weapon_type;
            document.getElementById('infoWepMat').innerText = data.weapon_material;
            document.getElementById('infoBackstory').innerText = data.backstory;

            const list = document.getElementById('guildsList');
            if (data.guilds && data.guilds.length > 0) {
                list.innerHTML = data.guilds.map(g => `<p>${g}</p>`).join('');
                document.getElementById('guildsSection').style.display = 'block';
            } else {
                document.getElementById('guildsSection').style.display = 'none';
            }
            document.getElementById('profileCard').style.display = 'block';
        }

        async function loadMyProfile() {
            if (!currentUserId) return;
            const docRef = doc(db, "characters", currentUserId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                renderCharacterData(docSnap.data(), auth.currentUser.email);
                document.getElementById('btnMyProfile').style.display = 'none';
                document.getElementById('btnDelete').style.display = 'block';
                showMainMenu();
            }
        }

        async function viewAllHeroes() {
            document.getElementById('mainBoard').style.display = 'none';
            document.getElementById('heroesListContainer').style.display = 'block';
            const listDiv = document.getElementById('heroesList');
            listDiv.innerHTML = "<p>Reading scrolls...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "characters"));
                listDiv.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const hero = doc.data();
                    const item = document.createElement('div');
                    item.style.cssText = "padding: 10px; border-bottom: 1px solid #444; cursor: pointer;";
                    item.innerHTML = `<strong>${hero.name}</strong> — ${hero.race}`;
                    item.onclick = () => {
                        renderCharacterData(hero);
                        document.getElementById('btnMyProfile').style.display = 'block';
                        document.getElementById('btnDelete').style.display = 'none';
                    };
                    listDiv.appendChild(item);
                });
            } catch (e) {
                listDiv.innerHTML = "<p style='color:red'>Error loading heroes.</p>";
            }
        }

        function showMainMenu() {
            document.getElementById('mainBoard').style.display = 'block';
            document.getElementById('heroesListContainer').style.display = 'none';
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                await loadMyProfile();
            } else {
                window.location.href = "generator.html";
            }
        });

        // ПРИВЯЗКА К WINDOW[cite: 4]
        window.viewAllHeroes = viewAllHeroes;
        window.loadMyProfile = loadMyProfile;
        window.showMainMenu = showMainMenu;
        window.generateShout = () => {
            let words = ["FUS", "RO", "DAH", "YOL", "TOOR", "SHUL", "LOK", "VAH", "KOOR"];
            let shout = words[Math.floor(Math.random() * words.length)] + " " +
                words[Math.floor(Math.random() * words.length)] + " " +
                words[Math.floor(Math.random() * words.length)];
            document.getElementById("output").innerHTML = "Dragon Shout: <b>" + shout + "</b>";
        };
        window.showTamrielDate = () => {
            let today = new Date();
            let months = ["Morning Star", "Sun's Dawn", "First Seed", "Rain's Hand", "Second Seed", "Midyear", "Sun's Height", "Last Seed", "Hearthfire", "Frostfall", "Sun's Dusk", "Evening Star"];
            let days = ["Sundas", "Morndas", "Tirdas", "Middas", "Turdas", "Fredas", "Loredas"];
            document.getElementById("output").innerHTML = "Today in Tamriel:<br>" + days[today.getDay()] + ", " + today.getDate() + " of " + months[today.getMonth()] + ", " + today.getFullYear();
        };
        window.deleteCharacter = async () => {
            if (confirm("Are you sure?")) {
                await deleteDoc(doc(db, "characters", currentUserId));
                window.location.href = "generator.html";
            }
        };

        // Плавный переход
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.querySelector('.page-transition-overlay');
            if (overlay) setTimeout(() => overlay.classList.add('fade-out'), 100);
        });
    </script>
</body>

</html>
